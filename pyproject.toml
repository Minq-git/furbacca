[tool.ruff]
# Set line length slightly longer (120) for math-heavy NumPy arrays
line-length = 120
# Debian Trixie on Pi uses modern Python
target-version = "py311"

[tool.ruff.lint]
# Enable standard rules + import sorting + NumPy + Modern syntax upgrades
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes (unused variables/imports)
    "I",   # isort (import sorting)
    "NPY", # NumPy-specific rules
    "UP"   # pyupgrade (modernize syntax)
]

# We ignore E501 (line too long) so the linter doesn't yell at you 
# if a specific math formula in shapes.py needs to be on one line.
ignore = ["E501"]

[tool.ruff.format]
# Standard formatting style
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
# Match ruff target (py311) so 3.10+ syntax (e.g. X | Y unions) is allowed
pythonVersion = "3.11"
# Use project venv so numpy, PIL, etc. resolve (reportMissingImports)
venvPath = "."
venv = "env"

# Exclude reference/vendor code (e.g. picamera2) from type checking
exclude = ["reference"]

# Vision/py is run as a script (python vision/py/main_eyes.py) with vision/py on sys.path;
# flat imports (messages, assets, engine, hardware) are intentional. Disable implicit-relative check.
reportImplicitRelativeImport = "none"

# Resolve flat imports under vision/py (e.g. from assets import config in engine/)
extraPaths = ["vision/py"]

# Pi-only or optional deps (picamera2, gc9a01py, spidev, vision_messages) may be missing on Mac
reportMissingImports = "warning"
reportAttributeAccessIssue = "warning"

# Reduce noise: focus on real type errors; treat unknown/missing annotations as warnings or hints
typeCheckingMode = "basic"
reportUnknownParameterType = "warning"
reportUnknownVariableType = "warning"
reportUnknownMemberType = "warning"
reportMissingParameterType = "warning"
reportAny = "warning"
reportOptionalMemberAccess = "warning"
reportUnusedCallResult = "warning"
reportUnusedParameter = "warning"